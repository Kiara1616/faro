name: Python tests

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pytest -q --ignore=tests/test_ui_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiTests = @(
            'tests/test_ui_recovery.py::test_manual_recovery_button_is_disabled_until_review',
            'tests/test_ui_recovery.py::test_console_contract_keeps_simulation_and_plan_context_visible',
            'tests/test_ui_recovery.py::test_console_contract_exposes_blocking_alert_without_color_only_signal'
          )
          foreach ($uiTest in $uiTests) {
            python -m pytest -q $uiTest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 2
          }
      - name: Import desktop UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from faro.ui import FaroWindow; app=QApplication([]); window=FaroWindow(); print(window.windowTitle())"
