name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pytest -q --ignore=tests/test_ui_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiOutput = @(python -m pytest -q tests/test_ui_recovery.py 2>&1)
          $uiExit = $LASTEXITCODE
          $uiOutput | Write-Output
          if ($uiExit -ne 0 -and -not ($uiOutput -match '^\d+ passed in ')) {
            exit $uiExit
          }
          if ($uiExit -ne 0) {
            Write-Warning 'Qt finalizó con código nativo no cero después de las pruebas aprobadas; se conserva el resultado de pytest.'
          }
          python scripts/check_offline_boundary.py --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import desktop UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from faro.ui import FaroWindow; app=QApplication([]); window=FaroWindow(); print(window.windowTitle())"
